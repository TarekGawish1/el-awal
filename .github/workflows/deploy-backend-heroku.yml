name: Deploy Backend to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality_gate:
    name: Backend Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Monorepo Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Backend TypeScript Check
        run: cd apps/backend && bun x tsc --noEmit

      - name: Backend Test Suite
        run: cd apps/backend && bun run test

      - name: Dependency Security Audit
        run: |
          # SEC-16/SEC-21: Audit workspace dependencies for critical vulnerabilities
          bun audit --audit-level=critical

  deploy:
    name: Deploy Backend Subtree to Heroku
    needs: [quality_gate]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy Backend to Heroku via Git Subtree
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          # 1. Validate required GitHub Secrets
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::HEROKU_API_KEY secret is missing! Please configure it in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$HEROKU_APP_NAME" ]; then
            echo "::error::HEROKU_APP_NAME secret is missing! Please configure it in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 2. Configure Heroku authentication via ~/.netrc (official & secure method)
          printf "machine api.heroku.com\n  login %s\n  password %s\nmachine git.heroku.com\n  login %s\n  password %s\n" "${HEROKU_EMAIL:-_}" "${HEROKU_API_KEY}" "${HEROKU_EMAIL:-_}" "${HEROKU_API_KEY}" > ~/.netrc
          chmod 600 ~/.netrc

          # 3. Configure Git credentials & remote with Heroku Basic Auth (username: _)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add heroku "https://_:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"

          # 3.5 Ensure Bun buildpack is configured on Heroku
          echo "Configuring Bun buildpack on Heroku app '${HEROKU_APP_NAME}'..."
          curl -s -n -X PUT "https://api.heroku.com/apps/${HEROKU_APP_NAME}/buildpack-installations" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Content-Type: application/json" \
            -d '{"updates":[{"buildpack":"https://github.com/jakeg/heroku-buildpack-bun.git"}]}' || true

          # 4. Extract backend tree into a deployment commit instantly (avoids slow 1200+ commit subtree scan)
          echo "Extracting apps/backend tree..."
          BACKEND_TREE=$(git rev-parse "HEAD:apps/backend")
          BACKEND_COMMIT=$(git commit-tree "${BACKEND_TREE}" -m "Deploy backend $(git rev-parse --short HEAD)")

          if [ -z "$BACKEND_COMMIT" ]; then
            echo "::error::Failed to extract subtree commit for apps/backend"
            exit 1
          fi

          echo "Subtree commit SHA: ${BACKEND_COMMIT}"

          # 5. Push to Heroku (supports both main and master default branches)
          echo "Deploying to Heroku app '${HEROKU_APP_NAME}'..."
          git push --force heroku "${BACKEND_COMMIT}:refs/heads/main" || git push --force heroku "${BACKEND_COMMIT}:refs/heads/master"

