name: Deploy Backend to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            echo "==> 1. Navigating to project directory & pulling latest code"
            cd /var/www/el-awal
            git fetch origin main
            git reset --hard origin/main

            echo "==> 2. Installing Backend Dependencies (scoped workspace)"
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm ci --workspace=@el-awal/backend --include-workspace-root || npm install --workspace=@el-awal/backend --include-workspace-root

            echo "==> 3. Generating Prisma Client & Deploying Migrations"
            npm run prisma:generate
            npm run prisma:migrate:deploy || echo "Prisma migrate deploy skipped/failed (check if DB exists)"

            echo "==> 4. Building Backend"
            npm run build:backend

            echo "==> 5. Reloading PM2 Service & Diagnostics"
            mkdir -p /var/www/el-awal/apps/backend/logs
            pm2 delete el-awal-backend || true
            # Free up port 3000 if occupied by any orphan process
            fuser -k 3000/tcp 2>/dev/null || true

            pm2 start /var/www/el-awal/ecosystem.config.js --env production
            pm2 save
            pm2 status

            echo "==> 6. Waiting 4s & Checking PM2 Logs"
            sleep 4
            pm2 logs el-awal-backend --lines 50 --nostream

            echo "==> 7. Testing Local Endpoint"
            curl -i http://127.0.0.1:3000/api/v1/health/ping || true
            echo "==> Backend Deployment Finished Successfully!"
