<!DOCTYPE html>
<html>
<head>
</head>
<body>
  <div id="svg-container"></div>
  <script>
    fetch('/certificationFile.svg').then(r => r.text()).then(text => {
      document.getElementById('svg-container').innerHTML = text;
      const svg = document.querySelector('svg');
      const paths = svg.querySelectorAll('path');
      let log = [];
      paths.forEach(p => {
        const box = p.getBBox();
        // check if it intersects with our points
        const points = [
          {name: 'B', x: 539, y: 475},
          {name: 'C', x: 741, y: 722},
          {name: 'D', x: 948, y: 917},
          {name: 'E', x: 716, y: 910},
          {name: 'F', x: 532, y: 823}
        ];
        points.forEach(pt => {
          if (pt.x >= box.x && pt.x <= box.x + box.width &&
              pt.y >= box.y && pt.y <= box.y + box.height) {
            log.push(`${pt.name}: path bbox = ${Math.round(box.x)},${Math.round(box.y)} w=${Math.round(box.width)} h=${Math.round(box.height)} fill=${p.getAttribute('fill')}`);
            p.setAttribute('fill', 'red');
          }
        });
      });
      console.log(log.join('\\n'));
      document.body.innerHTML += '<pre>' + log.join('<br>') + '</pre>';
    });
  </script>
</body>
</html>
